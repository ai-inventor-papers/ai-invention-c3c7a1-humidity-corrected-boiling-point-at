[project]
name = "boiling_point_comparison"
version = "0.1.0"
description = "Boiling point model comparison experiment: ISA baseline vs Kinetic vs Dissolved Gas models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.2.6",
    "loguru==0.7.3",
    "jsonschema==4.25.1",
    "matplotlib==3.10.7",
    "scipy==1.16.3",
    "pandas==2.3.3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]