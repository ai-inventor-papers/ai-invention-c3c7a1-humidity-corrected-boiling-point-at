[project]
name = "kinetic-boiling-model-evaluation"
version = "1.0.0"
description = "Evaluation of boiling point models at altitude: ISA baseline, Kinetic effect model, and Dissolved Gas model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.2.6",
    "scipy==1.16.3",
    "matplotlib==3.10.7",
    "pandas==2.3.3",
    "jsonschema==4.25.1",
    "loguru==0.7.3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = []

[tool.pytest.ini_options]
testpaths = ["."]
python_files = "*.py"