[project]
name = "kinetic-boiling-point-analysis"
version = "1.0.0"
description = "Kinetic Boiling Point Model Sensitivity Analysis using Forbes 1857 Alpine dataset"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.2.6",
    "loguru==0.7.3",
    "scipy==1.16.3",
    "matplotlib==3.10.7",
    "jsonschema==4.25.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = []